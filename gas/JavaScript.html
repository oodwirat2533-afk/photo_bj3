<script>
// ============================================================================
// Global State
// ============================================================================
let state = {
  userCtx: null,
  folders: [],          // root album list
  navStack: [],         // breadcrumb: [{id, name}]
  photos: [],
  selectedFiles: [],
  currentPhoto: null,
  searchTimer: null
};

// ============================================================================
// 1. INIT
// ============================================================================
document.addEventListener('DOMContentLoaded', initApp);

function initApp() {
  checkUserStatus();
  loadAlbums();
}

function checkUserStatus() {
  google.script.run
    .withSuccessHandler(onUserStatusRetrieved)
    .withFailureHandler(onServerError)
    .getUserContext();
}

function onUserStatusRetrieved(ctx) {
  state.userCtx = ctx;
  renderUserNavbar(ctx);
  document.getElementById('pendingBanner').style.display = ctx.role === 'PENDING' ? 'flex' : 'none';
}

function renderUserNavbar(ctx) {
  const userSection    = document.getElementById('userSection');
  const userEmailText  = document.getElementById('userEmailText');
  const rolePill       = document.getElementById('rolePill');

  if (ctx.email) {
    userSection.style.display = 'inline-flex';
    userEmailText.textContent = ctx.email;
    rolePill.className = 'role-pill';
    if      (ctx.role === 'SUPER_ADMIN')     { rolePill.textContent = 'Super Admin';   rolePill.classList.add('role-super'); }
    else if (ctx.role === 'ADMIN')           { rolePill.textContent = 'Admin';          rolePill.classList.add('role-admin'); }
    else if (ctx.role === 'ASSISTANT_ADMIN') { rolePill.textContent = 'ผู้ช่วย Admin'; rolePill.classList.add('role-assistant'); }
    else if (ctx.role === 'PENDING')         { rolePill.textContent = 'รออนุมัติ';      rolePill.classList.add('role-pending'); }
    else                                     { rolePill.textContent = 'บุคคลทั่วไป'; }
  } else {
    userSection.style.display = 'none';
  }

  const btnDriveConfig = document.getElementById('btnDriveConfig');
  const btnAdminPanel = document.getElementById('btnAdminPanel');
  const btnManageAlbums = document.getElementById('btnManageAlbums');
  const settingsDropdown = document.getElementById('settingsDropdown');

  const showDriveConfig = (ctx && ctx.isSuperAdmin);
  const showAdminPanel = (ctx && ctx.isSuperAdmin);
  const showManageAlbums = (ctx && ctx.isSuperAdmin);

  if (btnDriveConfig) btnDriveConfig.style.display = showDriveConfig ? 'flex' : 'none';
  if (btnAdminPanel) btnAdminPanel.style.display = showAdminPanel ? 'flex' : 'none';
  if (btnManageAlbums) btnManageAlbums.style.display = showManageAlbums ? 'flex' : 'none';

  if (settingsDropdown) {
    settingsDropdown.style.display = (showDriveConfig || showAdminPanel || showManageAlbums) ? 'inline-block' : 'none';
  }

  document.getElementById('btnRequestAccess').style.display = (!ctx.email || ctx.role === 'GUEST') ? 'inline-flex' : 'none';
  document.getElementById('btnUpload').style.display        = ctx.isCanUpload  ? 'inline-flex' : 'none';
  document.getElementById('btnCreateFolder').style.display  = ctx.isAdminOrHigher ? 'inline-flex' : 'none';
}

function toggleSettingsDropdown(event) {
  if (event) event.stopPropagation();
  const menu = document.getElementById('settingsMenu');
  if (menu) {
    menu.classList.toggle('show');
  }
}

function closeSettingsDropdown() {
  const menu = document.getElementById('settingsMenu');
  if (menu) {
    menu.classList.remove('show');
  }
}

window.addEventListener('click', function(e) {
  const dropdown = document.getElementById('settingsDropdown');
  if (dropdown && !dropdown.contains(e.target)) {
    closeSettingsDropdown();
  }
  if (e.target.classList.contains('modal') && e.target.classList.contains('active')) {
    closeModal(e.target.id);
  }
});

window.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const activeModals = document.querySelectorAll('.modal.active');
    activeModals.forEach(m => closeModal(m.id));
  }
});

// ============================================================================
// 2. ROOT ALBUM CARDS (View 1)
// ============================================================================
function loadAlbums() {
  const albumGrid = document.getElementById('albumGrid');
  albumGrid.innerHTML = `
    <div class="album-card-skeleton skeleton"></div>
    <div class="album-card-skeleton skeleton"></div>
    <div class="album-card-skeleton skeleton"></div>
    <div class="album-card-skeleton skeleton"></div>`;

  google.script.run
    .withSuccessHandler(renderAlbumGrid)
    .withFailureHandler(onServerError)
    .getDriveFolders();
}

function renderAlbumGrid(folders) {
  state.folders = folders;
  const albumGrid   = document.getElementById('albumGrid');
  albumGrid.innerHTML   = '';

  if (folders.length === 0) {
    albumGrid.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-icon">📁</div>
        <h3>ยังไม่มีอัลบั้มภาพ</h3>
        <p>Super Admin สามารถตั้งค่าโฟลเดอร์ Google Drive หรือ Admin สามารถสร้างอัลบั้มใหม่ได้</p>
      </div>`;
    return;
  }

  folders.forEach(f => {
    albumGrid.appendChild(buildAlbumCard(f, () => openFolder(f.id, f.name)));
  });
}

/** Build an album/subfolder card element */
function buildAlbumCard(f, onClick) {
  const card = document.createElement('div');
  card.className = 'album-card';
  card.onclick = onClick;

  const coverHtml = f.coverUrl
    ? `<img class="album-cover-img" src="${f.coverUrl}" alt="${escapeHtml(f.name)}" loading="lazy"
         onerror="this.parentElement.innerHTML='<div class=\\'album-cover-placeholder\\'>📷<span>ไม่มีรูปภาพ</span></div>'">`
    : `<div class="album-cover-placeholder">📷<span>ไม่มีรูปภาพ</span></div>`;

  card.innerHTML = `
    <div class="album-cover">
      ${coverHtml}
      <div class="album-cover-gradient"></div>
    </div>
    <div class="album-info">
      <div class="album-name">${f.isRoot ? '🖼️' : '📁'} ${escapeHtml(f.name)}</div>
      <div class="album-arrow">›</div>
    </div>`;
  return card;
}

// ============================================================================
// 3. OPEN FOLDER — check for subfolders first
// ============================================================================
function openFolder(folderId, folderName) {
  // Push to navigation stack
  state.navStack.push({ id: folderId, name: folderName });

  // Switch to photo view and show loading
  document.getElementById('viewAlbums').style.display = 'none';
  document.getElementById('viewPhotos').style.display = 'block';
  const searchInputEl = document.getElementById('searchInput');
  if (searchInputEl) searchInputEl.value = '';

  renderBreadcrumb();
  showPhotoSkeletons();

  // Smart load: check if this folder has subfolders
  google.script.run
    .withSuccessHandler(onFolderContentsLoaded)
    .withFailureHandler(onServerError)
    .getFolderContents(folderId);
}

function onFolderContentsLoaded(contents) {
  if (contents.type === 'subfolders') {
    // Has subfolders → show subfolder cards + any direct photos below
    renderSubfolderView(contents.subfolders, contents.directPhotos);
  } else {
    // Leaf folder → show photos
    renderGalleryGrid(contents.directPhotos);
  }
}

/** Render subfolder cards + optional direct photos section */
function renderSubfolderView(subfolders, directPhotos) {
  state.photos = directPhotos;

  const grid = document.getElementById('galleryGrid');
  document.getElementById('photoCountBadge').textContent = `${subfolders.length} โฟลเดอร์`;

  grid.innerHTML = '';

  // Subfolder cards section
  const subGrid = document.createElement('div');
  subGrid.className = 'album-grid';
  subGrid.style.cssText = 'margin-bottom: 1.5rem; grid-column: 1/-1;';
  subfolders.forEach(sub => {
    subGrid.appendChild(buildAlbumCard(sub, () => openFolder(sub.id, sub.name)));
  });
  grid.appendChild(subGrid);

  // Direct photos section (if any photos exist alongside subfolders)
  if (directPhotos && directPhotos.length > 0) {
    const divider = document.createElement('div');
    divider.style.cssText = 'grid-column: 1/-1; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1rem; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-muted);';
    divider.innerHTML = `<span>📷 รูปภาพในโฟลเดอร์นี้ (${directPhotos.length} รูป)</span>`;
    grid.appendChild(divider);

    directPhotos.forEach(photo => {
      grid.appendChild(buildPhotoCard(photo));
    });
  }

  document.getElementById('photoCountBadge').textContent = `${subfolders.length} โฟลเดอร์${directPhotos.length > 0 ? ' + ' + directPhotos.length + ' รูป' : ''}`;
}

// ============================================================================
// 4. PHOTO GRID — for leaf folders
// ============================================================================
function showPhotoSkeletons() {
  document.getElementById('galleryGrid').innerHTML = `
    <div class="photo-card skeleton" style="height:220px;"></div>
    <div class="photo-card skeleton" style="height:220px;"></div>
    <div class="photo-card skeleton" style="height:220px;"></div>
    <div class="photo-card skeleton" style="height:220px;"></div>`;
}

function renderGalleryGrid(photos) {
  state.photos = photos;
  const grid = document.getElementById('galleryGrid');
  document.getElementById('photoCountBadge').textContent = `${photos.length} รูปภาพ`;

  if (photos.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📷</div>
        <h3>ไม่พบรูปภาพในโฟลเดอร์นี้</h3>
        <p>ยังไม่มีการอัปโหลดรูปภาพ หรือไม่พบไฟล์ตรงตามคำค้นหา</p>
      </div>`;
    return;
  }

  grid.innerHTML = '';
  photos.forEach(photo => grid.appendChild(buildPhotoCard(photo)));
}

function buildPhotoCard(photo) {
  const card = document.createElement('div');
  card.className = 'photo-card';
  card.innerHTML = `
    <div class="photo-img-wrapper" onclick="openLightbox('${photo.id}')">
      <img class="photo-img" src="${photo.thumbnailLink}" alt="${escapeHtml(photo.name)}" loading="lazy"
        onerror="this.src='https://via.placeholder.com/400x300?text=Error+Loading'">
      <div class="photo-overlay">
        <span style="font-size:0.8rem;color:#93c5fd;">🔍 คลิกเพื่อขยายใหญ่</span>
      </div>
    </div>
    <div class="photo-details">
      <div>
        <div class="photo-title" title="${escapeHtml(photo.name)}">${escapeHtml(photo.name)}</div>
        <div class="photo-meta">${photo.created} • ${photo.size}</div>
      </div>
    </div>`;
  return card;
}

// ============================================================================
// 5. BREADCRUMB NAVIGATION
// ============================================================================
function renderBreadcrumb() {
  const title = document.getElementById('galleryTitle');
  const stack = state.navStack;

  if (stack.length === 0) return;

  let html = '';
  // Clickable breadcrumb items (all but last)
  for (let i = 0; i < stack.length - 1; i++) {
    const item = stack[i];
    html += `<span class="breadcrumb-link" onclick="navToStack(${i})">${escapeHtml(item.name)}</span> <span style="color:var(--text-dim)">›</span> `;
  }
  // Current (last) item
  html += `<span>📸</span> <span>${escapeHtml(stack[stack.length - 1].name)}</span>`;

  title.innerHTML = html;
}

/** Navigate back to a specific position in nav stack */
function navToStack(index) {
  if (index < 0 || index >= state.navStack.length - 1) return;
  const target = state.navStack[index];
  state.navStack = state.navStack.slice(0, index + 1);

  showPhotoSkeletons();
  const searchInputEl = document.getElementById('searchInput');
  if (searchInputEl) searchInputEl.value = '';

  google.script.run
    .withSuccessHandler(onFolderContentsLoaded)
    .withFailureHandler(onServerError)
    .getFolderContents(target.id);
}

function backToAlbums() {
  state.navStack = [];
  state.photos = [];
  document.getElementById('viewPhotos').style.display = 'none';
  document.getElementById('viewAlbums').style.display = 'block';
  const searchInputEl = document.getElementById('searchInput');
  if (searchInputEl) searchInputEl.value = '';
}

// ============================================================================
// 6. SEARCH
// ============================================================================
function handleSearchInput(e) {
  clearTimeout(state.searchTimer);
  const keyword = e.target.value;

  if (state.navStack.length > 0) {
    // Inside an album — search recursively
    state.searchTimer = setTimeout(() => {
      const currentId = state.navStack[state.navStack.length - 1].id;
      showPhotoSkeletons();
      google.script.run
        .withSuccessHandler(renderGalleryGrid)
        .withFailureHandler(onServerError)
        .searchPhotos(currentId, keyword);
    }, 400);
  } else {
    // On album grid — filter by album name
    const kw = keyword.toLowerCase();
    document.querySelectorAll('.album-card').forEach(card => {
      const name = card.querySelector('.album-name').textContent.toLowerCase();
      card.style.display = name.includes(kw) ? '' : 'none';
    });
  }
}

// ============================================================================
// 7. LIGHTBOX
// ============================================================================
function openLightbox(photoId) {
  const photo = state.photos.find(p => p.id === photoId);
  if (!photo) return;
  state.currentPhoto = photo;
  document.getElementById('lightboxTitle').textContent  = photo.name;
  document.getElementById('lightboxImage').src          = photo.viewLink;
  document.getElementById('lightboxMeta').textContent   = `วันที่อัปโหลด: ${photo.created} | ขนาด: ${photo.size}`;
  document.getElementById('lightboxDownloadBtn').href   = photo.downloadLink;
  document.getElementById('btnDeletePhoto').style.display = (state.userCtx && state.userCtx.isAdminOrHigher) ? 'inline-flex' : 'none';
  openModal('lightboxModal');
}

function deleteCurrentPhoto() {
  if (!state.currentPhoto) return;
  if (!confirm(`คุณต้องการลบรูปภาพ "${state.currentPhoto.name}" ใช่หรือไม่?`)) return;
  showToast('กำลังลบรูปภาพ...', 'info');
  google.script.run
    .withSuccessHandler(res => {
      showToast(res.message, 'success');
      closeModal('lightboxModal');
      // Reload current folder
      const currentId = state.navStack[state.navStack.length - 1].id;
      showPhotoSkeletons();
      google.script.run.withSuccessHandler(onFolderContentsLoaded).withFailureHandler(onServerError).getFolderContents(currentId);
    })
    .withFailureHandler(onServerError)
    .deletePhoto(state.currentPhoto.id);
}

// ============================================================================
// 8. UPLOAD
// ============================================================================
function openUploadModal() {
  state.selectedFiles = [];
  document.getElementById('selectedFilesList').innerHTML = '';
  document.getElementById('fileInput').value = '';
  document.getElementById('btnSubmitUpload').disabled = true;

  const currentNav = state.navStack[state.navStack.length - 1];
  const uploadSelect = document.getElementById('uploadFolderSelect');
  const targetNameEl = document.getElementById('uploadTargetFolderName');

  if (currentNav && currentNav.id !== 'root') {
    if (uploadSelect) uploadSelect.value = currentNav.id;
    if (targetNameEl) targetNameEl.textContent = currentNav.name;
  } else if (state.folders && state.folders.length > 0) {
    if (uploadSelect) uploadSelect.value = state.folders[0].id;
    if (targetNameEl) targetNameEl.textContent = state.folders[0].name;
  } else {
    if (uploadSelect) uploadSelect.value = '';
    if (targetNameEl) targetNameEl.textContent = 'ยังไม่มีอัลบั้ม';
  }

  openModal('uploadModal');
}

function handleFileSelect(e) { addFiles(Array.from(e.target.files)); }

function addFiles(files) {
  const valid = files.filter(f => f.type.startsWith('image/'));
  state.selectedFiles = state.selectedFiles.concat(valid);
  const container = document.getElementById('selectedFilesList');
  container.innerHTML = `<strong>เลือกไฟล์ทั้งหมด ${state.selectedFiles.length} รายการ:</strong><br>`;
  state.selectedFiles.forEach(f => { container.innerHTML += `• ${escapeHtml(f.name)} (${formatBytes(f.size)})<br>`; });
  document.getElementById('btnSubmitUpload').disabled = state.selectedFiles.length === 0;
}

async function submitUpload() {
  if (!state.selectedFiles.length) return;
  const targetFolderId = document.getElementById('uploadFolderSelect').value;
  const btnSubmit = document.getElementById('btnSubmitUpload');
  btnSubmit.disabled = true;
  btnSubmit.innerHTML = '<span>⏳</span> กำลังอ่านไฟล์...';
  try {
    const filePayloads = await Promise.all(state.selectedFiles.map(async f => ({
      name: f.name, mimeType: f.type, base64Data: await readFileAsBase64(f)
    })));
    btnSubmit.innerHTML = '<span>🚀</span> กำลังอัปโหลด...';
    showToast(`กำลังอัปโหลด ${filePayloads.length} ไฟล์...`, 'info');
    google.script.run
      .withSuccessHandler(res => {
        showToast(`อัปโหลดสำเร็จ ${res.uploadedCount} จาก ${res.total} ไฟล์`, 'success');
        closeModal('uploadModal');
        loadAlbums();
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<span>🚀</span> เริ่มต้นอัปโหลด';
      })
      .withFailureHandler(err => { onServerError(err); btnSubmit.disabled = false; btnSubmit.innerHTML = '<span>🚀</span> เริ่มต้นอัปโหลด'; })
      .uploadPhotos(targetFolderId, filePayloads);
  } catch (err) {
    showToast('เกิดข้อผิดพลาด: ' + err.toString(), 'error');
    btnSubmit.disabled = false;
  }
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

const dropZone = document.getElementById('dropZone');
['dragenter','dragover','dragleave','drop'].forEach(e => dropZone.addEventListener(e, ev => { ev.preventDefault(); ev.stopPropagation(); }, false));
['dragenter','dragover'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.add('dragover'), false));
['dragleave','drop'].forEach(e => dropZone.addEventListener(e, () => dropZone.classList.remove('dragover'), false));
dropZone.addEventListener('drop', e => addFiles(Array.from(e.dataTransfer.files)), false);

// ============================================================================
// 9. CREATE FOLDER
// ============================================================================
function openCreateFolderModal() { document.getElementById('newFolderNameInput').value = ''; openModal('createFolderModal'); }

function submitCreateFolder() {
  const name = document.getElementById('newFolderNameInput').value;
  if (!name.trim()) { showToast('กรุณาระบุชื่ออัลบั้ม', 'error'); return; }
  showToast('กำลังสร้างอัลบั้มใหม่...', 'info');
  google.script.run
    .withSuccessHandler(res => { showToast(`สร้างอัลบั้ม "${res.folder.name}" เรียบร้อยแล้ว`, 'success'); closeModal('createFolderModal'); loadAlbums(); })
    .withFailureHandler(onServerError)
    .createDriveFolder(name);
}

// ============================================================================
// 10. DRIVE CONFIG (Super Admin)
// ============================================================================
function openDriveConfigModal() {
  openModal('driveConfigModal');
  const infoDiv = document.getElementById('currentDriveInfo');
  infoDiv.innerHTML = 'กำลังดึงข้อมูลโฟลเดอร์ปัจจุบัน...';
  google.script.run
    .withSuccessHandler(info => {
      infoDiv.innerHTML = `<strong>📁 โฟลเดอร์ปัจจุบัน:</strong><br>• ชื่อ: <strong>${escapeHtml(info.name)}</strong><br>• ID: <code>${info.id}</code><br>• <a href="${info.url}" target="_blank" style="color:#60a5fa;text-decoration:underline;">เปิดใน Google Drive ↗</a>`;
      document.getElementById('driveUrlInput').value = info.url;
    })
    .withFailureHandler(onServerError)
    .getRootFolderInfo();
}

function submitDriveConfig() {
  const urlOrId = document.getElementById('driveUrlInput').value;
  if (!urlOrId.trim()) { showToast('กรุณาระบุ Google Drive Folder URL หรือ Folder ID', 'error'); return; }
  showToast('กำลังเชื่อมต่อโฟลเดอร์...', 'info');
  google.script.run
    .withSuccessHandler(res => { showToast(res.message, 'success'); closeModal('driveConfigModal'); loadAlbums(); })
    .withFailureHandler(onServerError)
    .updateRootFolderUrl(urlOrId);
}

// ============================================================================
// 11. USER REQUEST & ADMIN MANAGEMENT
// ============================================================================
function openRequestModal() {
  if (confirm('คุณต้องการส่งคำขอสิทธิ์ผู้ดูแลระบบหรือไม่?')) {
    showToast('กำลังส่งคำขอ...', 'info');
    google.script.run
      .withSuccessHandler(res => { showToast(res.message, 'success'); checkUserStatus(); })
      .withFailureHandler(onServerError)
      .requestAccess();
  }
}

function openAdminUserModal() { openModal('adminUserModal'); loadUsersList(); }

function loadUsersList() {
  document.getElementById('userTableBody').innerHTML = '<tr><td colspan="3" style="text-align:center;padding:2rem;">กำลังโหลด...</td></tr>';
  google.script.run.withSuccessHandler(renderUserTable).withFailureHandler(onServerError).getUsersList();
}

function renderUserTable(users) {
  const tbody = document.getElementById('userTableBody');
  tbody.innerHTML = '';
  users.forEach(u => {
    const tr = document.createElement('tr');
    let badge = '';
    if      (u.role === 'SUPER_ADMIN')     badge = `<span class="role-pill role-super">Super Admin</span>`;
    else if (u.role === 'ADMIN')           badge = `<span class="role-pill role-admin">Admin</span>`;
    else if (u.role === 'ASSISTANT_ADMIN') badge = `<span class="role-pill role-assistant">ผู้ช่วย Admin</span>`;
    else if (u.role === 'PENDING')         badge = `<span class="role-pill role-pending">รออนุมัติ</span>`;
    else                                   badge = `<span class="role-pill">ปฏิเสธแล้ว</span>`;
    const actions = u.isFixed
      ? `<em style="color:var(--accent);font-size:0.8rem;">ผู้ดูแลหลัก (Fixed)</em>`
      : `<button class="btn btn-primary"   style="padding:0.25rem 0.5rem;font-size:0.75rem;" onclick="changeUserRole('${u.email}','ADMIN')">อนุมัติ Admin</button>
         <button class="btn btn-secondary" style="padding:0.25rem 0.5rem;font-size:0.75rem;" onclick="changeUserRole('${u.email}','ASSISTANT_ADMIN')">อนุมัติ ผู้ช่วย Admin</button>
         <button class="btn btn-danger"    style="padding:0.25rem 0.5rem;font-size:0.75rem;" onclick="changeUserRole('${u.email}','REJECTED')">ยกเลิกสิทธิ์</button>`;
    tr.innerHTML = `
      <td><div style="font-weight:500;">${escapeHtml(u.displayName)}</div><div style="font-size:0.75rem;color:var(--text-muted);">${escapeHtml(u.email)}</div></td>
      <td>${badge}</td>
      <td><div style="display:flex;gap:0.35rem;flex-wrap:wrap;">${actions}</div></td>`;
    tbody.appendChild(tr);
  });
}

function changeUserRole(email, newRole) {
  showToast(`กำลังเปลี่ยนสิทธิ์ของ ${email}...`, 'info');
  google.script.run
    .withSuccessHandler(res => { showToast(res.message, 'success'); loadUsersList(); checkUserStatus(); })
    .withFailureHandler(onServerError)
    .updateUserRole(email, newRole);
}

// ============================================================================
// 12. MODALS & UTILITIES
// ============================================================================
function openModal(id) {
  const modal = document.getElementById(id);
  if (modal) {
    modal.classList.add('active');
    document.body.classList.add('modal-open');
  }
}

function closeModal(id) {
  const modal = document.getElementById(id);
  if (modal) {
    modal.classList.remove('active');
  }
  if (!document.querySelector('.modal.active')) {
    document.body.classList.remove('modal-open');
  }
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  const icon = type === 'success' ? '✅' : type === 'error' ? '⚠️' : 'ℹ️';
  toast.innerHTML = `<span>${icon}</span> <span>${escapeHtml(message)}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 4500);
}

function onServerError(err) { showToast(err.message || err.toString(), 'error'); }

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function formatBytes(bytes) {
  if (bytes === 0) return '0 Bytes';
  const k = 1024, sizes = ['Bytes','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes)/Math.log(k));
  return parseFloat((bytes/Math.pow(k,i)).toFixed(2)) + ' ' + sizes[i];
}
